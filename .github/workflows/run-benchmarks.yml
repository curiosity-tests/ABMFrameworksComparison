name: run-benchmarks
run-name: "run-benchmarks ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  Run-benchmark-flocking:
    runs-on: ubuntu-latest
    steps:
       - name: Cancel ongoing test runs for previous commits
         uses: styfle/cancel-workflow-action@0.11.0
       - uses: crashappsec/action-checkout@main
         with:
           chalk: ${{ env.CHALK_ON }}
           profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
           lfs: false
       - name: Assert instrumentation is live
         if: env.CHALK_ON == 'true'
         continue-on-error: true
         run: |
           test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
       - name: setup-benchmarks
         run: bash ./.github/setup.sh
       - name: run-benchmarks
         run: bash ./.github/run-flocking.sh
  Run-benchmark-wolfsheep:
    runs-on: ubuntu-latest
    steps:
       - name: Cancel ongoing test runs for previous commits
         uses: styfle/cancel-workflow-action@0.11.0
       - uses: crashappsec/action-checkout@main
         with:
           chalk: ${{ env.CHALK_ON }}
           profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
           lfs: false
       - name: Assert instrumentation is live
         if: env.CHALK_ON == 'true'
         continue-on-error: true
         run: |
           test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
       - name: setup-benchmarks
         run: bash ./.github/setup.sh
       - name: run-benchmarks
         run: bash ./.github/run-wolfsheep.sh
  Run-benchmark-schelling:
    runs-on: ubuntu-latest
    steps:
       - name: Cancel ongoing test runs for previous commits
         uses: styfle/cancel-workflow-action@0.11.0
       - uses: crashappsec/action-checkout@main
         with:
           chalk: ${{ env.CHALK_ON }}
           profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
           lfs: false
       - name: Assert instrumentation is live
         if: env.CHALK_ON == 'true'
         continue-on-error: true
         run: |
           test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
       - name: setup-benchmarks
         run: bash ./.github/setup.sh
       - name: run-benchmarks
         run: bash ./.github/run-schelling.sh
